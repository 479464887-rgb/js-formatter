<!DOCTYPE html><html lang="zh-CN"><head>

<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="JavaScript Formatter - JS代码格式化与美化工具"><meta property="og:title" content="JS Formatter"><title>JS Formatter</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d1117;color:#c9d1d9;min-height:100vh}header{background:#161b22;border-bottom:1px solid #30363d;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}header h1{font-size:20px;color:#58a6ff}.lang-switch{display:flex;gap:4px}.lang-switch button{background:#21262d;color:#c9d1d9;border:1px solid #30363d;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px}.lang-switch button.active{background:#1f6feb;border-color:#1f6feb;color:#fff}.container{max-width:1200px;margin:0 auto;padding:24px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.btn{background:#21262d;color:#c9d1d9;border:1px solid #30363d;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:all .2s}.btn:hover{background:#30363d}.btn-primary{background:#238636;border-color:#238636;color:#fff}.btn-primary:hover{background:#2ea043}.options{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:8px;font-size:13px}.options label{display:flex;align-items:center;gap:6px;cursor:pointer}.options input[type=number]{width:60px;background:#0d1117;color:#c9d1d9;border:1px solid #30363d;border-radius:4px;padding:4px 8px;font-size:13px}.panel{background:#161b22;border:1px solid #30363d;border-radius:8px;overflow:hidden;margin-bottom:16px}.panel-header{background:#21262d;padding:10px 16px;font-size:13px;font-weight:600;border-bottom:1px solid #30363d;color:#58a6ff}.panel textarea{width:100%;height:350px;background:#0d1117;color:#c9d1d9;border:none;padding:12px;font-family:'SF Mono',Monaco,monospace;font-size:13px;resize:vertical;line-height:1.5;tab-size:2}.panel textarea:focus{outline:none}#stats{padding:8px 16px;font-size:12px;color:#8b949e}</style></head><body><header><h1>⚡ JS Formatter</h1><div class="lang-switch"><button class="active" onclick="setLang('zh')">中文</button><button onclick="setLang('en')">EN</button></div></header><div class="container"><div class="options"><label>缩进 <input type="number" id="indent" value="2" min="1" max="8"></label></div><div class="toolbar"><button class="btn btn-primary" onclick="formatJS()">✨ 格式化</button><button class="btn" onclick="minifyJS()">📦 压缩</button><button class="btn" onclick="copyOutput()">📋 复制</button><button class="btn" onclick="clearAll()">🗑 清空</button></div><div class="panel"><div class="panel-header">输入 JavaScript</div><textarea id="input" placeholder="function hello(){console.log('world')}"></textarea></div><div class="panel"><div class="panel-header">输出 / Output</div><textarea id="output" readonly placeholder="格式化结果将在这里显示..."></textarea><div id="stats"></div></div></div><script>let lang='zh';function setLang(l){lang=l;document.querySelectorAll('.lang-switch button').forEach((b,i)=>b.classList.toggle('active',(i===0&&l==='zh')||(i===1&&l==='en')))}function formatJS(){const code=document.getElementById('input').value;if(!code){showErr();return}try{const indent=' '.repeat(parseInt(document.getElementById('indent').value)||2);let formatted='';let depth=0;let i=0;let inString=null;let inTemplate=0;let inComment=false;let inLineComment=false;while(i<code.length){let c=code[i];let nc=code[i+1]||'';if(inLineComment&&c==='\n'){inLineComment=false;formatted+=c;depth>0&&(formatted+=' '.repeat(depth*indent.length));i++;continue}if(inLineComment){formatted+=c;i++;continue}if(inComment&&c==='*'&&nc==='/'){inComment=false;formatted+='*/';i+=2;continue}if(inComment){formatted+=c;i++;continue}if(inString){formatted+=c;if(c==='\\'){formatted+=nc;i+=2;continue}if(c===inString){inString=null}i++;continue}if(inTemplate){formatted+=c;if(c==='\\'){formatted+=nc;i+=2;continue}if(c==='`')inTemplate--;i++;continue}if(!inString&&!inComment&&!inLineComment&&!inTemplate){if(c==='/'&&nc==='/'){inLineComment=true;formatted+='//';i+=2;continue}if(c==='/'&&nc==='*'){inComment=true;formatted+='/*';i+=2;continue}if(c==='\''||c==='"'||c==='`'){if(c==='`')inTemplate=1;else inString=c;formatted+=c;i++;continue}if(c==='{'||c==='['){depth++;formatted+=c+'\n'+' '.repeat(depth*indent.length);i++;continue}if(c==='}'||c===']'){depth=Math.max(0,depth-1);formatted=formatted.trimEnd();formatted+='\n'+' '.repeat(depth*indent.length)+c;i++;if(code[i]===','){formatted+=',';i++}if(code[i]&&code[i]!=='}'&&code[i]!==']'&&code[i]!==';')formatted+='\n'+' '.repeat(depth*indent.length);continue}if(c===','&&depth>0){formatted+=c+'\n'+' '.repeat(depth*indent.length);i++;continue}if(c===';'){formatted+=c;i++;if(code[i]&&code[i]!=='}'&&code[i]!=='\n')formatted+='\n'+' '.repeat(depth*indent.length);continue}if(c==='\n'){formatted+=c;if(depth>0&&code[i+1])formatted+=' '.repeat(depth*indent.length);i++;continue}}formatted+=c;i++}document.getElementById('output').value=formatted.replace(/\n{3,}/g,'\n\n').trim();updateStats()}catch(e){document.getElementById('output').value='Error: '+e.message}}function minifyJS(){const code=document.getElementById('input').value;if(!code){showErr();return}let m='';let inStr=null;let i=0;while(i<code.length){let c=code[i];if(inStr){m+=c;if(c==='\\'){m+=code[i+1]||'';i+=2;continue}if(c===inStr)inStr=null;i++;continue}if(!inStr&&(c==='"'||c==='\''||c==='`')){inStr=(c==='`')?'`':c;m+=c;i++;continue}if(!inStr&&c==='/'&&code[i+1]=='/'){while(i<code.length&&code[i]!=='\n')i++;continue}if(!inStr&&c==='/'&&code[i+1]=='*'){i+=2;while(i<code.length&&!(code[i]==='*'&&code[i+1]=='/'))i++;i+=2;continue}m+=c;i++}m=m.replace(/\s+/g,' ').replace(/\s*([{}();,:])\s*/g,'$1').replace(/([{}])/g,'$1').trim();document.getElementById('output').value=m;updateStats(m)}function showErr(){document.getElementById('output').value=lang==='zh'?'请先输入JavaScript代码':'Please enter JavaScript first'}function updateStats(r){var o=document.getElementById('input').value.length;var f=(r||document.getElementById('output').value).length;var pct=o?Math.round((1-f/o)*100):0;document.getElementById('stats').innerHTML=lang==='zh'?'原始: '+o+' 字符 | 输出: '+f+' 字符 | '+(pct>=0?'减少':'增加')+' '+Math.abs(pct)+'%':'Original: '+o+' chars | Output: '+f+' chars | '+(pct>=0?'Reduced':'Increased')+' '+Math.abs(pct)+'%'}function copyOutput(){document.getElementById('output').select();document.execCommand('copy')}function clearAll(){document.getElementById('input').value='';document.getElementById('output').value='';document.getElementById('stats').innerHTML=''}</script></body></html>
